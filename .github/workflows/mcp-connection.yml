name: MCP connection checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: news_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Session authentication and role isolation on disposable PostgreSQL
        run: npx tsx --test tests/session-authentication.integration.ts
        env:
          DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
          APP_URL: http://127.0.0.1:3070
          AUTH_SECRET: ci-only-news-session-proof-test-secret
      - run: npm run build
      - run: npm run typecheck
      - name: Actual MCP credential isolation on disposable PostgreSQL
        run: npx tsx scripts/check-mcp-connection.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
      - name: Reviewed preview edits on disposable PostgreSQL
        run: npx tsx scripts/check-mcp-preview.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
      - name: Reviewed publication and durable receipts on disposable PostgreSQL
        run: npx tsx scripts/check-reviewed-publication.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
      - name: Coordinated maintenance on disposable PostgreSQL
        run: npx tsx scripts/check-periodic-maintenance.ts
        env:
          MAINTENANCE_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
      - name: Regional editions and delivery preferences on disposable PostgreSQL
        run: npx tsx scripts/check-regional-delivery.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
      - name: Bounded worker idle polling
        run: python3 -m unittest discover -s worker -p test_idle_polling.py
