name: MCP connection checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: news_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Actual MCP credential isolation on disposable PostgreSQL
        run: npx tsx scripts/check-mcp-connection.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/news_test
